name: Offline safety tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify published file checksums
        run: sha256sum -c SHA256SUMS
      - name: Run network-guarded offline regressions
        run: python -B tests/run_offline.py
      - name: CLI smoke test (no credentials or network)
        run: |
          python -B scripts/repeater_cmd.py --version
          python -B scripts/repeater_cmd.py --help
